<svg version="1.2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <style>
      .house { fill: #000000; }
      .text-primary { fill: #000000; font-family: serif; font-weight: bold; }
      .text-secondary { fill: #000000; font-family: sans-serif; }
      .text-small { fill: #000000; font-family: sans-serif; font-size: 8px; }
      .decorative { fill: #000000; }
    </style>
  </defs>
  
  <!-- House Icon -->
  <g class="house">
    <!-- House structure -->
    <path d="M200 40 L180 60 L180 80 L220 80 L220 60 Z" />
    <!-- Windows -->
    <rect x="185" y="65" width="8" height="8" fill="white" />
    <rect x="207" y="65" width="8" height="8" fill="white" />
  </g>
  
  <!-- Decorative flourishes -->
  <g class="decorative">
    <path d="M120 100 Q140 90 160 100 Q140 110 120 100" />
    <path d="M240 100 Q260 90 280 100 Q260 110 240 100" />
  </g>
  
  <!-- KIERA text -->
  <text x="200" y="130" text-anchor="middle" class="text-primary" font-size="24">KIERA</text>
  
  <!-- HOMES text with lines -->
  <line x1="170" y1="145" x2="180" y2="145" class="decorative" stroke-width="1" />
  <text x="200" y="150" text-anchor="middle" class="text-secondary" font-size="12">HOMES</text>
  <line x1="220" y1="145" x2="230" y2="145" class="decorative" stroke-width="1" />
  
  <!-- Company name -->
  <text x="200" y="170" text-anchor="middle" class="text-small">CONSTRUCTION &amp; DEVELOPERS PVT. LTD.</text>
</svg>
